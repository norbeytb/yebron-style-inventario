<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yebron Style — Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --bg-panel: #1c2129;
    --bg-panel-2: #232935;
    --line: #2c333f;
    --text: #edeef0;
    --text-dim: #9099a8;
    --text-faint: #5c6474;
    --amber: #e8a33d;
    --teal: #4fb0a5;
    --red: #d9634f;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 90px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  header.top h1 { font-family: var(--font-display); font-size: 32px; letter-spacing: 0.5px; margin: 0; color: var(--amber); }
  header.top .sub { color: var(--text-faint); font-size: 12px; }

  nav.tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; overflow-x: auto; }
  nav.tabs button { flex: 1; min-width: 90px; background: transparent; border: none; color: var(--text-dim); font-family: var(--font-body); font-weight: 600; font-size: 13.5px; padding: 10px 8px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { background: var(--amber); color: #1c1300; }

  .panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .panel h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 14px; color: var(--text); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .stat .label { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .stat .value { font-family: var(--font-display); font-size: 24px; }
  .stat.pos .value { color: var(--teal); }
  .stat.neg .value { color: var(--red); }
  .stat.warn .value { color: var(--amber); }

  form.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
  input, select { width: 100%; background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: var(--font-body); }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  button.btn { background: var(--amber); color: #1c1300; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: var(--font-body); }
  button.btn.secondary { background: var(--bg-panel-2); color: var(--text); border: 1px solid var(--line); }
  button.btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  button.btn.small { padding: 6px 10px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; color: var(--text-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px; border-bottom: 1px solid var(--line); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .table-scroll { overflow-x: auto; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge.ok { background: rgba(79,176,165,.15); color: var(--teal); }
  .badge.warn { background: rgba(217,99,79,.15); color: var(--red); }
  .empty { text-align: center; color: var(--text-faint); padding: 30px 10px; font-size: 13.5px; }
  .muted { color: var(--text-faint); font-size: 12px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 14px; }
  .modal-row { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 30px; font-size: 13px; z-index: 60; }

  #loginView { max-width: 360px; margin: 80px auto; }
  #loginView h1 { font-family: var(--font-display); font-size: 30px; color: var(--amber); text-align: center; margin-bottom: 4px; }
  #loginView .sub { text-align: center; color: var(--text-faint); font-size: 12.5px; margin-bottom: 22px; }
  .error-msg { color: var(--red); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>

<div id="loginView" style="display:none">
  <h1>YEBRON STYLE</h1>
  <div class="sub">Control de inventario</div>
  <div class="panel">
    <form id="formLogin">
      <div class="modal-row">
        <label>Usuario</label>
        <input type="text" name="usuario" required autocomplete="username">
      </div>
      <div class="modal-row">
        <label>Contraseña</label>
        <input type="password" name="clave" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
      <div class="error-msg" id="loginError"></div>
    </form>
  </div>
</div>

<div id="appView" class="wrap" style="display:none">
  <header class="top">
    <div>
      <h1>YEBRON STYLE</h1>
      <div class="sub">Inventario · Ventas</div>
    </div>
    <button class="btn secondary small" id="btnSalir">Salir</button>
  </header>

  <nav class="tabs">
    <button data-tab="resumen" class="active">Resumen</button>
    <button data-tab="inventario">Inventario</button>
    <button data-tab="ventas">Ventas</button>
  </nav>

  <div id="tab-resumen"></div>
  <div id="tab-inventario" style="display:none"></div>
  <div id="tab-ventas" style="display:none"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const API = ''; // mismo origen (este backend sirve también esta página) — si la publicás suelta en otro lugar, poné acá la URL del backend en Railway.
let token = localStorage.getItem('inv_token') || '';
let productos = [];
let invSort = { field: 'fechaCompra', dir: 'desc' };
let ventasSearch = '';

function uid() { return Math.random().toString(36).slice(2); }
function money(n) { n = Number(n) || 0; return '$' + n.toLocaleString('es-CO', { maximumFractionDigits: 0 }); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function monthKey(iso) { return iso ? iso.slice(0, 7) : ''; }
function monthLabel(key) {
  if (!key) return 'Sin fecha';
  const [y, m] = key.split('-');
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[parseInt(m,10)-1]} ${y}`;
}
function showToast(msg) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
function computed(p) {
  const venta = Number(p.valorVenta) || 0, costo = Number(p.costo) || 0, envio = Number(p.envio) || 0, abono = Number(p.abono) || 0;
  return {
    ganancia: p.estado === 'vendido' ? (venta - costo - envio) : 0,
    resta: p.estado === 'vendido' ? Math.max(venta - abono, 0) : 0,
  };
}

// ---------- API ----------
async function api(path, opts = {}) {
  const resp = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
  });
  if (resp.status === 401) {
    cerrarSesion();
    throw new Error('Tu sesión venció — volvé a entrar.');
  }
  const datos = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(datos?.message || 'Ocurrió un error.');
  return datos;
}

async function cargarProductos() {
  try {
    productos = await api('/productos');
    renderAll();
  } catch (err) {
    showToast(err.message);
  }
}

// ---------- LOGIN ----------
function mostrarLogin() {
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('appView').style.display = 'none';
}
function mostrarApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  cargarProductos();
}
function cerrarSesion() {
  token = '';
  localStorage.removeItem('inv_token');
  mostrarLogin();
}

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const resultado = await api('/auth/login', { method: 'POST', body: JSON.stringify({ usuario: f.usuario.value, clave: f.clave.value }) });
    token = resultado.token;
    localStorage.setItem('inv_token', token);
    mostrarApp();
  } catch (err) {
    errEl.textContent = err.message;
  }
});
document.getElementById('btnSalir').addEventListener('click', cerrarSesion);

// ---------- TABS ----------
function switchTab(tab) {
  document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  ['resumen', 'inventario', 'ventas'].forEach((t) => { document.getElementById('tab-' + t).style.display = (t === tab) ? 'block' : 'none'; });
}
document.querySelectorAll('nav.tabs button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

function renderAll() { renderResumen(); renderInventario(); renderVentas(); }

// ---------- RESUMEN ----------
function renderResumen() {
  const el = document.getElementById('tab-resumen');
  const disponibles = productos.filter((p) => p.estado === 'disponible');
  const vendidos = productos.filter((p) => p.estado === 'vendido');
  const totalVentas = vendidos.reduce((s, p) => s + (Number(p.valorVenta) || 0), 0);
  const totalGanancia = vendidos.reduce((s, p) => s + computed(p).ganancia, 0);
  const totalPendiente = vendidos.reduce((s, p) => s + computed(p).resta, 0);
  const totalInvertidoStock = disponibles.reduce((s, p) => s + (Number(p.costo) || 0) + (Number(p.envio) || 0), 0);

  const curMonthKey = todayISO().slice(0, 7);
  const ventasMes = vendidos.filter((p) => monthKey(p.fechaVenta) === curMonthKey);
  const gananciaMes = ventasMes.reduce((s, p) => s + computed(p).ganancia, 0);

  el.innerHTML = `
    <div class="grid-cards">
      <div class="stat"><div class="label">En stock</div><div class="value">${disponibles.length}</div></div>
      <div class="stat"><div class="label">Vendidos</div><div class="value">${vendidos.length}</div></div>
      <div class="stat pos"><div class="label">Ganancia total</div><div class="value">${money(totalGanancia)}</div></div>
      <div class="stat ${totalPendiente > 0 ? 'warn' : ''}"><div class="label">Por cobrar</div><div class="value">${money(totalPendiente)}</div></div>
    </div>
    <div class="grid-cards">
      <div class="stat"><div class="label">Ventas totales</div><div class="value" style="font-size:20px">${money(totalVentas)}</div></div>
      <div class="stat"><div class="label">Invertido en stock</div><div class="value" style="font-size:20px">${money(totalInvertidoStock)}</div></div>
      <div class="stat pos"><div class="label">Ganancia este mes</div><div class="value" style="font-size:20px">${money(gananciaMes)}</div></div>
    </div>
    <div class="panel">
      <h2>Resumen por mes</h2>
      ${renderMonthlySummary(vendidos)}
    </div>
  `;
}
function renderMonthlySummary(vendidos) {
  if (!vendidos.length) return `<div class="empty">Aún no hay ventas registradas.</div>`;
  const byMonth = {};
  vendidos.forEach((p) => {
    const k = monthKey(p.fechaVenta) || 'sin-fecha';
    if (!byMonth[k]) byMonth[k] = { count: 0, ventas: 0, ganancia: 0, pendiente: 0 };
    byMonth[k].count++;
    byMonth[k].ventas += Number(p.valorVenta) || 0;
    byMonth[k].ganancia += computed(p).ganancia;
    byMonth[k].pendiente += computed(p).resta;
  });
  const keys = Object.keys(byMonth).sort().reverse();
  return `<div class="table-scroll"><table>
    <thead><tr><th>Mes</th><th>Unidades</th><th>Ventas</th><th>Ganancia</th><th>Pendiente</th></tr></thead>
    <tbody>${keys.map((k) => `<tr>
      <td>${monthLabel(k)}</td><td>${byMonth[k].count}</td><td>${money(byMonth[k].ventas)}</td>
      <td style="color:var(--teal)">${money(byMonth[k].ganancia)}</td>
      <td style="color:${byMonth[k].pendiente > 0 ? 'var(--red)' : 'var(--text-faint)'}">${money(byMonth[k].pendiente)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

// ---------- INVENTARIO ----------
function sortUnits(list, sort) {
  const arr = [...list];
  arr.sort((a, b) => {
    let va = a[sort.field], vb = b[sort.field];
    if (sort.field === 'costo' || sort.field === 'envio') { va = Number(va) || 0; vb = Number(vb) || 0; }
    else { va = (va || '').toString().toLowerCase(); vb = (vb || '').toString().toLowerCase(); }
    if (va < vb) return sort.dir === 'asc' ? -1 : 1;
    if (va > vb) return sort.dir === 'asc' ? 1 : -1;
    return 0;
  });
  return arr;
}
function setInvSort(field) {
  if (invSort.field === field) invSort.dir = invSort.dir === 'asc' ? 'desc' : 'asc';
  else { invSort.field = field; invSort.dir = field === 'fechaCompra' ? 'desc' : 'asc'; }
  renderInventario();
}
function sortArrow(field, sort) { return field !== sort.field ? '' : (sort.dir === 'asc' ? ' ▲' : ' ▼'); }

function renderInventario() {
  const el = document.getElementById('tab-inventario');
  const disponibles = sortUnits(productos.filter((p) => p.estado === 'disponible'), invSort);

  el.innerHTML = `
    <div class="panel">
      <h2>Agregar al inventario</h2>
      <form id="formNuevo" class="grid-form">
        <div><label>Fecha de compra</label><input type="date" name="fechaCompra" value="${todayISO()}" required></div>
        <div><label>Referencia / modelo</label><input type="text" name="referencia" placeholder="Nike Air Max"></div>
        <div><label>Talla</label><input type="text" name="talla" placeholder="EUR 40" required></div>
        <div><label>Costo</label><input type="number" name="costo" min="0" placeholder="90000" required></div>
        <div><label>Envío</label><input type="number" name="envio" min="0" value="0"></div>
        <div><label>Precio de venta sugerido</label><input type="number" name="precioVentaSugerido" min="0" placeholder="135000"></div>
        <div><label>Imagen (link)</label><input type="text" name="imagen" placeholder="https://..."></div>
        <div><label>Descripción</label><input type="text" name="descripcion" placeholder="Opcional"></div>
        <div><button class="btn" type="submit">Agregar</button></div>
      </form>
    </div>
    <div class="panel">
      <h2>Stock disponible (${disponibles.length})</h2>
      ${disponibles.length ? `<div class="table-scroll"><table>
        <thead><tr>
          <th style="cursor:pointer" onclick="setInvSort('fechaCompra')">Fecha${sortArrow('fechaCompra', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('referencia')">Referencia${sortArrow('referencia', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('talla')">Talla${sortArrow('talla', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('costo')">Costo${sortArrow('costo', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('envio')">Envío${sortArrow('envio', invSort)}</th>
          <th>Venta sug.</th><th></th>
        </tr></thead>
        <tbody>${disponibles.map((p) => `<tr>
          <td>${fmtDate(p.fechaCompra)}</td><td>${p.referencia || '—'}</td><td>${p.talla}</td>
          <td>${money(p.costo)}</td><td>${money(p.envio)}</td><td>${p.precioVentaSugerido ? money(p.precioVentaSugerido) : '—'}</td>
          <td><button class="btn small" onclick="openVenderModal(${p.id})">Vender</button>
          <button class="btn small danger" onclick="deleteProducto(${p.id})">✕</button></td>
        </tr>`).join('')}</tbody>
      </table></div>` : `<div class="empty">No hay unidades en stock. Agregá la primera arriba.</div>`}
    </div>
  `;

  document.getElementById('formNuevo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await api('/productos', {
        method: 'POST',
        body: JSON.stringify({
          fechaCompra: f.fechaCompra.value,
          referencia: f.referencia.value,
          talla: f.talla.value,
          costo: Number(f.costo.value) || 0,
          envio: Number(f.envio.value) || 0,
          precioVentaSugerido: f.precioVentaSugerido.value ? Number(f.precioVentaSugerido.value) : undefined,
          imagen: f.imagen.value,
          descripcion: f.descripcion.value,
        }),
      });
      showToast('Agregado al inventario');
      await cargarProductos();
      switchTab('inventario');
    } catch (err) { showToast(err.message); }
  });
}

function deleteProducto(id) {
  showConfirm('¿Eliminar esta unidad del inventario? No se puede deshacer.', async () => {
    try { await api('/productos/' + id, { method: 'DELETE' }); showToast('Eliminado'); await cargarProductos(); }
    catch (err) { showToast(err.message); }
  });
}

// ---------- VENTAS ----------
function renderVentas() {
  const el = document.getElementById('tab-ventas');
  let vendidos = productos.filter((p) => p.estado === 'vendido').sort((a, b) => (b.fechaVenta || '').localeCompare(a.fechaVenta || ''));
  if (ventasSearch.trim()) {
    const q = ventasSearch.trim().toLowerCase();
    vendidos = vendidos.filter((p) => (p.cliente || '').toLowerCase().includes(q));
  }
  el.innerHTML = `
    <div class="panel">
      <h2>Ventas registradas (${vendidos.length})</h2>
      <div style="margin-bottom:14px"><input type="text" id="buscarCliente" placeholder="Buscar por cliente..." value="${ventasSearch.replace(/"/g,'&quot;')}"></div>
      ${vendidos.length ? `<div class="table-scroll"><table>
        <thead><tr><th>Fecha</th><th>Talla</th><th>Cliente</th><th>Venta</th><th>Abono</th><th>Resta</th><th>Ganancia</th><th></th></tr></thead>
        <tbody>${vendidos.map((p) => { const c = computed(p); return `<tr>
          <td>${fmtDate(p.fechaVenta)}</td><td>${p.talla}</td><td>${p.cliente || '—'}</td>
          <td>${money(p.valorVenta)}</td><td>${money(p.abono)}</td>
          <td>${c.resta > 0 ? `<span class="badge warn">${money(c.resta)}</span>` : `<span class="badge ok">Pagado</span>`}</td>
          <td style="color:var(--teal)">${money(c.ganancia)}</td>
          <td>${c.resta > 0 ? `<button class="btn small" onclick="openAbonoModal(${p.id})">Abonar</button>` : ''}
          <button class="btn small secondary" onclick="revertirVenta(${p.id})">Revertir</button></td>
        </tr>`; }).join('')}</tbody>
      </table></div>` : `<div class="empty">${ventasSearch.trim() ? 'No hay ventas de ese cliente.' : 'Todavía no hay ventas — marcá una unidad como vendida desde Inventario.'}</div>`}
    </div>
  `;
  const input = document.getElementById('buscarCliente');
  if (input) input.addEventListener('input', (e) => { ventasSearch = e.target.value; const pos = e.target.selectionStart; renderVentas(); const n = document.getElementById('buscarCliente'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });
}

function revertirVenta(id) {
  showConfirm('¿Revertir esta venta? La unidad vuelve al inventario disponible.', async () => {
    try { await api('/productos/' + id + '/revertir-venta', { method: 'PATCH' }); showToast('Venta revertida'); await cargarProductos(); }
    catch (err) { showToast(err.message); }
  });
}

// ---------- MODALES ----------
function openVenderModal(id) {
  const p = productos.find((x) => x.id === id);
  if (!p) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay"><div class="modal">
      <h3>Registrar venta — ${p.talla}</h3>
      <form id="formVender">
        <div class="modal-row"><label>Cliente</label><input type="text" name="cliente" required placeholder="Nombre del cliente"></div>
        <div class="modal-row"><label>Fecha de venta</label><input type="date" name="fechaVenta" value="${todayISO()}" required></div>
        <div class="modal-row"><label>Precio de venta</label><input type="number" name="valorVenta" min="0" required value="${p.precioVentaSugerido || ''}"></div>
        <div class="modal-row"><label>Abono inicial (0 si fía todo)</label><input type="number" name="abono" min="0" value="0">
          <button type="button" class="btn small secondary" style="margin-top:6px" onclick="document.querySelector('#formVender [name=abono]').value = document.querySelector('#formVender [name=valorVenta]').value || 0">Pagó todo de contado</button>
        </div>
        <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Confirmar venta</button></div>
      </form>
    </div></div>
  `;
  document.getElementById('formVender').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await api('/productos/' + id + '/vender', {
        method: 'PATCH',
        body: JSON.stringify({ cliente: f.cliente.value, fechaVenta: f.fechaVenta.value, valorVenta: Number(f.valorVenta.value) || 0, abono: Number(f.abono.value) || 0 }),
      });
      closeModal(); showToast('Venta registrada'); await cargarProductos(); switchTab('ventas');
    } catch (err) { showToast(err.message); }
  });
}
function openAbonoModal(id) {
  const p = productos.find((x) => x.id === id);
  if (!p) return;
  const resta = computed(p).resta;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay"><div class="modal">
      <h3>Registrar abono</h3>
      <p class="muted">Cliente: ${p.cliente} · Saldo pendiente: ${money(resta)}</p>
      <form id="formAbono">
        <div class="modal-row"><label>Monto del abono</label><input type="number" name="monto" min="1" max="${resta}" required></div>
        <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Registrar</button></div>
      </form>
    </div></div>
  `;
  document.getElementById('formAbono').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api('/productos/' + id + '/abonar', { method: 'PATCH', body: JSON.stringify({ monto: Number(e.target.monto.value) || 0 }) });
      closeModal(); showToast('Abono registrado'); await cargarProductos();
    } catch (err) { showToast(err.message); }
  });
}
function showConfirm(msg, onConfirm) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay"><div class="modal">
      <h3>Confirmar</h3><p class="muted">${msg}</p>
      <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn danger" id="confirmBtn" style="background:var(--red); color:#fff; border:none">Eliminar</button></div>
    </div></div>
  `;
  document.getElementById('confirmBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

// ---------- INIT ----------
(function init() {
  if (token) mostrarApp(); else mostrarLogin();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --bg-panel: #1c2129;
    --bg-panel-2: #232935;
    --line: #2c333f;
    --text: #edeef0;
    --text-dim: #9099a8;
    --text-faint: #5c6474;
    --amber: #e8a33d;
    --amber-dim: #7a5a26;
    --teal: #4fb0a5;
    --red: #d9634f;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2efe9;
      --bg-panel: #ffffff;
      --bg-panel-2: #f7f5f0;
      --line: #e2ddd2;
      --text: #1c1c1c;
      --text-dim: #6b6459;
      --text-faint: #a39c8e;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100%;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 90px; }

  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 4px 2px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  header.top h1 {
    font-family: var(--font-display);
    font-size: 34px;
    letter-spacing: 0.5px;
    margin: 0;
    color: var(--amber);
  }
  header.top .sub { color: var(--text-faint); font-size: 12px; }

  nav.tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px;
    overflow-x: auto;
  }
  nav.tabs button {
    flex: 1; min-width: 84px;
    background: transparent; border: none; color: var(--text-dim);
    font-family: var(--font-body); font-weight: 600; font-size: 13.5px;
    padding: 10px 8px; border-radius: 7px; cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  nav.tabs button.active { background: var(--amber); color: #1c1300; }
  nav.tabs button:not(.active):hover { color: var(--text); }

  /* Pantallas anchas: menú vertical fijo a la izquierda. En el celular
     queda horizontal arriba (vertical ocuparía media pantalla). */
  .layout { display: block; }
  .contenido { min-width: 0; }
  @media (min-width: 600px) {
    #appView.wrap { max-width: 1180px; }
    .layout { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
    nav.tabs {
      flex-direction: column; gap: 4px; margin-bottom: 0;
      position: sticky; top: 16px; overflow-x: visible;
    }
    nav.tabs button { flex: none; min-width: 0; text-align: left; padding: 11px 14px; }
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 20px; letter-spacing: 0.3px;
    margin: 0 0 14px; color: var(--text);
  }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 16px; }
  .stat {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px;
  }
  .stat .label { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .stat .value { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.3px; }
  .stat.pos .value { color: var(--teal); }
  .stat.neg .value { color: var(--red); }
  .stat.warn .value { color: var(--amber); }

  form.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
  input, select {
    width: 100%; background: var(--bg-panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 14px;
    font-family: var(--font-body);
  }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  button.btn {
    background: var(--amber); color: #1c1300; border: none; border-radius: 8px;
    padding: 10px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    font-family: var(--font-body);
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.secondary { background: var(--bg-panel-2); color: var(--text); border: 1px solid var(--line); }
  button.btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  button.btn.small { padding: 6px 10px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; color: var(--text-faint); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 8px 8px; border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:hover { background: var(--bg-panel-2); }
  .table-scroll { overflow-x: auto; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge.disponible { background: rgba(79,176,165,.15); color: var(--teal); }
  .badge.vendido { background: rgba(232,163,61,.15); color: var(--amber); }
  .badge.pendiente { background: rgba(217,99,79,.15); color: var(--red); }

  .empty { text-align: center; color: var(--text-faint); padding: 30px 10px; font-size: 13.5px; }
  .muted { color: var(--text-faint); font-size: 12px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    padding: 16px;
  }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 420px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 14px; }
  .modal-row { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 18px; border-radius: 30px; font-size: 13px; z-index: 60;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .login { max-width: 360px; margin: 12vh auto 0; }
  .login h1 { font-family: var(--font-display); font-size: 34px; letter-spacing: 0.5px; color: var(--amber); margin: 0 0 4px; }
  .login form { display: grid; gap: 12px; margin-top: 18px; }
  .login .error { color: var(--red); font-size: 13px; min-height: 18px; }
  header.top .acciones { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="wrap login" id="loginView" style="display:none">
  <div class="panel">
    <h1>CONTROL DE ZAPATOS</h1>
    <div class="muted">Entrá con tu usuario para ver el inventario.</div>
    <form id="formLogin">
      <div><label for="loginUsuario">Usuario</label><input id="loginUsuario" name="usuario" autocomplete="username" required></div>
      <div><label for="loginClave">Contraseña</label><input id="loginClave" name="clave" type="password" autocomplete="current-password" required></div>
      <div class="error" id="loginError"></div>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</div>

<div class="wrap" id="appView" style="display:none">
  <header class="top">
    <div>
      <h1>CONTROL DE ZAPATOS</h1>
      <div class="sub">Inventario · Ventas · Clientes</div>
    </div>
    <div class="acciones">
      <div class="sub" id="todayLabel"></div>
      <button class="btn small secondary" id="btnSalir" type="button">Salir</button>
    </div>
  </header>

  <div class="layout">
    <nav class="tabs">
      <button data-tab="resumen" class="active">Resumen</button>
      <button data-tab="inventario">Inventario</button>
      <button data-tab="ventas">Ventas</button>
      <button data-tab="abonos">Abonos</button>
      <button data-tab="clientes">Clientes</button>
      <button data-tab="gastos">Gastos</button>
    </nav>

    <main class="contenido">
      <div id="tab-resumen"></div>
      <div id="tab-inventario" style="display:none"></div>
      <div id="tab-ventas" style="display:none"></div>
      <div id="tab-abonos" style="display:none"></div>
      <div id="tab-clientes" style="display:none"></div>
      <div id="tab-gastos" style="display:none"></div>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<!-- api.js habla con el backend (login + datos en PostgreSQL) -->
<script src="api.js"></script>
<script>
let units = [];
let gastos = [];
let abonos = [];
let currentTab = 'resumen';
let invSort = { field: 'fechaCompra', dir: 'desc' };

function sortUnits(list, sort) {
  const arr = [...list];
  arr.sort((a, b) => {
    let va = a[sort.field], vb = b[sort.field];
    if (sort.field === 'costo' || sort.field === 'envio') {
      va = Number(va) || 0; vb = Number(vb) || 0;
    } else {
      va = (va || '').toString().toLowerCase();
      vb = (vb || '').toString().toLowerCase();
    }
    if (va < vb) return sort.dir === 'asc' ? -1 : 1;
    if (va > vb) return sort.dir === 'asc' ? 1 : -1;
    return 0;
  });
  return arr;
}

function sortArrow(field, sort) {
  if (field !== sort.field) return '';
  return sort.dir === 'asc' ? ' ▲' : ' ▼';
}

function setInvSort(field) {
  if (invSort.field === field) {
    invSort.dir = invSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    invSort.field = field;
    invSort.dir = field === 'fechaCompra' ? 'desc' : 'asc';
  }
  renderInventario();
}

function money(n) {
  n = Number(n) || 0;
  return '$' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}
function fmtDate(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function monthKey(iso) { return iso ? iso.slice(0,7) : ''; }
function monthLabel(key) {
  if (!key) return 'Sin fecha';
  const [y,m] = key.split('-');
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[parseInt(m,10)-1]} ${y}`;
}

function showToast(msg) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// Trae todo del backend y vuelve a dibujar. Se llama al entrar y después de
// cada cambio, así la pantalla siempre muestra lo que quedó guardado.
async function cargarDatos() {
  try {
    const d = await Api.cargar();
    units = d.units;
    gastos = d.gastos;
    abonos = d.abonos;
    renderAll();
  } catch (err) {
    showToast(err.message);
  }
}

// Corre un cambio contra el backend; si sale bien muestra okMsg y recarga.
async function guardar(accion, okMsg) {
  try {
    await accion();
    if (okMsg) showToast(okMsg);
    await cargarDatos();
    return true;
  } catch (err) {
    showToast(err.message);
    return false;
  }
}

function computed(u) {
  const venta = Number(u.venta) || 0;
  const costo = Number(u.costo) || 0;
  const envio = Number(u.envio) || 0;
  const abono = Number(u.abono) || 0;
  return {
    ganancia: u.estado === 'vendido' ? (venta - costo - envio) : 0,
    resta: u.estado === 'vendido' ? Math.max(venta - abono, 0) : 0,
  };
}


// ---------- RENDER: RESUMEN ----------
function renderResumen() {
  const el = document.getElementById('tab-resumen');
  const disponibles = units.filter(u => u.estado === 'disponible');
  const vendidos = units.filter(u => u.estado === 'vendido');
  const totalVentas = vendidos.reduce((s,u) => s + (Number(u.venta)||0), 0);
  const totalGanancia = vendidos.reduce((s,u) => s + computed(u).ganancia, 0);
  const totalPendiente = vendidos.reduce((s,u) => s + computed(u).resta, 0);
  const totalInvertido = disponibles.reduce((s,u) => s + (Number(u.costo)||0) + (Number(u.envio)||0), 0);
  const totalGastos = gastos.reduce((s,g) => s + (Number(g.monto)||0), 0);
  const gananciaNeta = totalGanancia - totalGastos;

  const curMonthKey = todayISO().slice(0,7);
  const ventasMes = vendidos.filter(u => monthKey(u.fechaVenta) === curMonthKey);
  const gananciaMes = ventasMes.reduce((s,u) => s + computed(u).ganancia, 0);
  const gastosMes = gastosDelMes(gastos, curMonthKey);
  const gananciaNetaMes = gananciaMes - gastosMes;

  el.innerHTML = `
    <div class="grid-cards">
      <div class="stat"><div class="label">En stock</div><div class="value">${disponibles.length}</div></div>
      <div class="stat"><div class="label">Vendidos</div><div class="value">${vendidos.length}</div></div>
      <div class="stat pos"><div class="label">Ganancia total</div><div class="value">${money(totalGanancia)}</div></div>
      <div class="stat ${totalPendiente>0?'warn':''}"><div class="label">Por cobrar</div><div class="value">${money(totalPendiente)}</div></div>
    </div>
    <div class="grid-cards">
      <div class="stat neg"><div class="label">Gastos totales</div><div class="value" style="font-size:20px">${money(totalGastos)}</div></div>
      <div class="stat ${gananciaNeta>=0?'pos':'neg'}"><div class="label">Ganancia neta (con gastos)</div><div class="value" style="font-size:20px">${money(gananciaNeta)}</div></div>
      <div class="stat ${gananciaNetaMes>=0?'pos':'neg'}"><div class="label">Ganancia neta este mes</div><div class="value" style="font-size:20px">${money(gananciaNetaMes)}</div></div>
    </div>
    <div class="grid-cards">
      <div class="stat"><div class="label">Ventas totales</div><div class="value" style="font-size:20px">${money(totalVentas)}</div></div>
      <div class="stat"><div class="label">Invertido en stock</div><div class="value" style="font-size:20px">${money(totalInvertido)}</div></div>
      <div class="stat pos"><div class="label">Ganancia este mes</div><div class="value" style="font-size:20px">${money(gananciaMes)}</div></div>
    </div>
    <div class="panel">
      <h2>Resumen por mes</h2>
      ${renderMonthlySummary(vendidos)}
    </div>
  `;
}

function renderMonthlySummary(vendidos) {
  if (!vendidos.length) return `<div class="empty">Aún no hay ventas registradas.</div>`;
  const byMonth = {};
  vendidos.forEach(u => {
    const k = monthKey(u.fechaVenta) || 'sin-fecha';
    if (!byMonth[k]) byMonth[k] = { count:0, ventas:0, ganancia:0, pendiente:0 };
    byMonth[k].count++;
    byMonth[k].ventas += Number(u.venta)||0;
    byMonth[k].ganancia += computed(u).ganancia;
    byMonth[k].pendiente += computed(u).resta;
  });
  const keys = Object.keys(byMonth).sort().reverse();
  return `
    <div class="table-scroll">
    <table>
      <thead><tr><th>Mes</th><th>Unidades</th><th>Ventas</th><th>Ganancia</th><th>Pendiente</th></tr></thead>
      <tbody>
        ${keys.map(k => `
          <tr>
            <td>${monthLabel(k === 'sin-fecha' ? '' : k)}</td>
            <td>${byMonth[k].count}</td>
            <td>${money(byMonth[k].ventas)}</td>
            <td style="color:var(--teal)">${money(byMonth[k].ganancia)}</td>
            <td style="color:${byMonth[k].pendiente>0?'var(--red)':'var(--text-faint)'}">${money(byMonth[k].pendiente)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
}

// ---------- RENDER: INVENTARIO ----------
function renderInventario() {
  const el = document.getElementById('tab-inventario');
  const disponibles = sortUnits(units.filter(u => u.estado === 'disponible'), invSort);

  el.innerHTML = `
    <div class="panel">
      <h2>Agregar unidad al inventario</h2>
      <form id="formNuevaUnidad" class="grid-form">
        <div>
          <label>Fecha de compra</label>
          <input type="date" name="fechaCompra" value="${todayISO()}" required>
        </div>
        <div>
          <label>Talla</label>
          <input type="text" name="talla" placeholder="EUR 40" required>
        </div>
        <div>
          <label>Modelo / referencia</label>
          <input type="text" name="modelo" placeholder="Nike Zoom">
        </div>
        <div>
          <label>Costo</label>
          <input type="number" name="costo" placeholder="75000" min="0" required>
        </div>
        <div>
          <label>Envío</label>
          <input type="number" name="envio" placeholder="5525" min="0" value="0">
        </div>
        <div>
          <label>Precio de venta sugerido</label>
          <input type="number" name="precioVentaSugerido" placeholder="Opcional" min="0">
        </div>
        <div>
          <button class="btn" type="submit">Agregar</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Stock disponible (${disponibles.length})</h2>
      ${disponibles.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th style="cursor:pointer" onclick="setInvSort('fechaCompra')">Fecha${sortArrow('fechaCompra', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('talla')">Talla${sortArrow('talla', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('modelo')">Modelo${sortArrow('modelo', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('costo')">Costo${sortArrow('costo', invSort)}</th>
          <th style="cursor:pointer" onclick="setInvSort('envio')">Envío${sortArrow('envio', invSort)}</th>
          <th>Venta sug.</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${disponibles.map(u => `
            <tr>
              <td>${fmtDate(u.fechaCompra)}</td>
              <td>${esc(u.talla)}</td>
              <td>${esc(u.modelo) || '—'}</td>
              <td>${money(u.costo)}</td>
              <td>${money(u.envio)}</td>
              <td>${u.precioVentaSugerido ? money(u.precioVentaSugerido) : '—'}</td>
              <td style="white-space:nowrap">
                <button class="btn small" onclick="openVenderModal('${u.id}')">Vender</button>
                <button class="btn small danger" onclick="deleteUnit('${u.id}')">✕</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">No hay unidades en stock. Agrega la primera arriba.</div>`}
    </div>
  `;

  document.getElementById('formNuevaUnidad').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const nueva = {
      fechaCompra: f.fechaCompra.value,
      talla: f.talla.value.trim(),
      modelo: f.modelo.value.trim(),
      costo: Number(f.costo.value) || 0,
      envio: Number(f.envio.value) || 0,
      precioVentaSugerido: f.precioVentaSugerido.value ? Number(f.precioVentaSugerido.value) : null
    };
    await guardar(() => Api.crearUnidad(nueva), 'Unidad agregada al inventario');
  });
}

function deleteUnit(id) {
  showConfirm('¿Eliminar esta unidad del inventario? Esta acción no se puede deshacer.', () =>
    guardar(() => Api.eliminarUnidad(id), 'Unidad eliminada'));
}

// ---------- RENDER: VENTAS ----------
let ventasSearch = '';
let ventasSort = { field: 'fechaVenta', dir: 'desc' };

function ventaVal(u, field) {
  const c = computed(u);
  if (field === 'resta') return c.resta;
  if (field === 'ganancia') return c.ganancia;
  if (field === 'venta' || field === 'abono') return Number(u[field]) || 0;
  return (u[field] || '').toString().toLowerCase();
}

function setVentasSort(field, dir) {
  if (dir) { ventasSort = { field, dir }; }
  else if (ventasSort.field === field) { ventasSort.dir = ventasSort.dir === 'asc' ? 'desc' : 'asc'; }
  else { ventasSort = { field, dir: (field === 'cliente' || field === 'talla') ? 'asc' : 'desc' }; }
  renderVentas();
}

function renderVentas() {
  const el = document.getElementById('tab-ventas');
  let vendidos = units.filter(u => u.estado === 'vendido');
  vendidos.sort((a,b) => {
    const va = ventaVal(a, ventasSort.field), vb = ventaVal(b, ventasSort.field);
    if (va < vb) return ventasSort.dir === 'asc' ? -1 : 1;
    if (va > vb) return ventasSort.dir === 'asc' ? 1 : -1;
    return 0;
  });
  const sortKey = ventasSort.field + ':' + ventasSort.dir;
  const th = (f, label) => `<th style="cursor:pointer; white-space:nowrap" onclick="setVentasSort('${f}')">${label}${sortArrow(f, ventasSort)}</th>`;

  if (ventasSearch.trim()) {
    const q = ventasSearch.trim().toLowerCase();
    vendidos = vendidos.filter(u => (u.cliente || '').toLowerCase().includes(q));
  }

  el.innerHTML = `
    <div class="panel">
      <h2>Ventas registradas (${vendidos.length})</h2>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:14px">
        <input type="text" id="buscarCliente" placeholder="Buscar por nombre de cliente..." value="${esc(ventasSearch)}">
        <select id="ordenVentas" aria-label="Ordenar ventas">
          <option value="fechaVenta:desc" ${sortKey==='fechaVenta:desc'?'selected':''}>Fecha: más recientes</option>
          <option value="fechaVenta:asc" ${sortKey==='fechaVenta:asc'?'selected':''}>Fecha: más antiguas</option>
          <option value="cliente:asc" ${sortKey==='cliente:asc'?'selected':''}>Cliente: A → Z</option>
          <option value="venta:desc" ${sortKey==='venta:desc'?'selected':''}>Venta: mayor a menor</option>
          <option value="resta:desc" ${sortKey==='resta:desc'?'selected':''}>Deuda: mayor a menor</option>
          <option value="ganancia:desc" ${sortKey==='ganancia:desc'?'selected':''}>Ganancia: mayor a menor</option>
          ${['fechaVenta:desc','fechaVenta:asc','cliente:asc','venta:desc','resta:desc','ganancia:desc'].includes(sortKey) ? '' : '<option value="'+sortKey+'" selected>Orden personalizado</option>'}
        </select>
      </div>
      ${vendidos.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr>${th('fechaVenta','Fecha')}${th('talla','Talla')}${th('cliente','Cliente')}${th('venta','Venta')}${th('abono','Abono')}${th('resta','Resta')}${th('ganancia','Ganancia')}<th></th></tr></thead>
        <tbody>
          ${vendidos.map(u => {
            const c = computed(u);
            return `
            <tr>
              <td>${fmtDate(u.fechaVenta)}</td>
              <td>${esc(u.talla)}</td>
              <td>${esc(u.cliente) || '—'}</td>
              <td>${money(u.venta)}</td>
              <td>${money(u.abono)}</td>
              <td>
                ${c.resta > 0 ? `<span class="badge pendiente">${money(c.resta)}</span>` : `<span class="badge disponible">Pagado</span>`}
              </td>
              <td style="color:var(--teal)">${money(c.ganancia)}</td>
              <td style="white-space:nowrap">
                ${c.resta > 0 ? `<button class="btn small" onclick="openAbonoModal('${u.id}')">Abonar</button>` : ''}
                <button class="btn small secondary" onclick="revertirVenta('${u.id}')">Revertir</button>
              </td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">${ventasSearch.trim() ? 'No hay ventas de ese cliente.' : 'No hay ventas registradas todavía. Ve a Inventario y marca una unidad como vendida.'}</div>`}
    </div>
  `;

  const ordenSel = document.getElementById('ordenVentas');
  if (ordenSel) {
    ordenSel.addEventListener('change', (e) => {
      const [f, d] = e.target.value.split(':');
      setVentasSort(f, d);
    });
  }

  const searchInput = document.getElementById('buscarCliente');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      ventasSearch = e.target.value;
      const cursorPos = e.target.selectionStart;
      renderVentas();
      const newInput = document.getElementById('buscarCliente');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(cursorPos, cursorPos);
      }
    });
  }
}

function revertirVenta(id) {
  const n = abonos.filter(a => a.unitId === id).length;
  const extra = n ? ` También se borrarán ${n} abono(s) registrados de esta venta.` : '';
  showConfirm('¿Revertir esta venta? La unidad volverá al inventario disponible.' + extra, () =>
    guardar(() => Api.revertirVenta(id), 'Venta revertida'));
}

// ---------- RENDER: ABONOS ----------
let abonosSearch = '';

function renderAbonos() {
  const el = document.getElementById('tab-abonos');
  const curMonthKey = todayISO().slice(0,7);
  const hoy = todayISO();

  const pendientes = units
    .filter(u => u.estado === 'vendido' && computed(u).resta > 0)
    .sort((a,b) => (a.fechaVenta||'').localeCompare(b.fechaVenta||''));
  const totalPorCobrar = pendientes.reduce((s,u) => s + computed(u).resta, 0);

  const totalAbonos = abonos.reduce((s,a) => s + (Number(a.monto)||0), 0);
  const abonosMes = abonos.filter(a => monthKey(a.fecha) === curMonthKey).reduce((s,a) => s + (Number(a.monto)||0), 0);
  const abonosHoy = abonos.filter(a => a.fecha === hoy).reduce((s,a) => s + (Number(a.monto)||0), 0);

  let historial = [...abonos].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
  if (abonosSearch.trim()) {
    const q = abonosSearch.trim().toLowerCase();
    historial = historial.filter(a => (a.cliente || '').toLowerCase().includes(q));
  }

  // Cuánto falta por cobrar a cada cliente (agrupado)
  const deudaCliente = {};
  pendientes.forEach(u => {
    const k = (u.cliente || 'Sin nombre').trim();
    deudaCliente[k] = (deudaCliente[k] || 0) + computed(u).resta;
  });

  el.innerHTML = `
    <div class="grid-cards">
      <div class="stat pos"><div class="label">Recibido hoy</div><div class="value">${money(abonosHoy)}</div></div>
      <div class="stat pos"><div class="label">Recibido este mes</div><div class="value">${money(abonosMes)}</div></div>
      <div class="stat ${totalPorCobrar>0?'warn':''}"><div class="label">Por cobrar</div><div class="value">${money(totalPorCobrar)}</div></div>
      <div class="stat"><div class="label">Abonos registrados</div><div class="value">${money(totalAbonos)}</div></div>
    </div>

    <div class="panel">
      <h2>Registrar abono</h2>
      ${pendientes.length ? `
      <form id="formNuevoAbono" class="grid-form">
        <div style="grid-column: 1 / -1">
          <label>Venta con saldo pendiente</label>
          <select name="unitId" required>
            ${pendientes.map(u => `<option value="${u.id}">${esc(u.cliente || 'Sin nombre')} · ${esc(u.talla)}${u.modelo ? ' ' + esc(u.modelo) : ''} · debe ${money(computed(u).resta)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" name="fecha" value="${hoy}" required>
        </div>
        <div>
          <label>Monto</label>
          <input type="number" name="monto" min="1" required placeholder="50000">
        </div>
        <div>
          <label>Nota (opcional)</label>
          <input type="text" name="nota" placeholder="Nequi, efectivo...">
        </div>
        <div>
          <button class="btn" type="submit">Registrar abono</button>
        </div>
      </form>
      ` : `<div class="empty">No hay ventas con saldo pendiente. ¡Todo cobrado!</div>`}
    </div>

    <div class="panel">
      <h2>Quién debe (${Object.keys(deudaCliente).length})</h2>
      ${pendientes.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Fecha venta</th><th>Cliente</th><th>Talla</th><th>Venta</th><th>Abonado</th><th>Resta</th><th></th></tr></thead>
        <tbody>
          ${pendientes.map(u => `
            <tr>
              <td>${fmtDate(u.fechaVenta)}</td>
              <td>${esc(u.cliente) || '—'}</td>
              <td>${esc(u.talla)}</td>
              <td>${money(u.venta)}</td>
              <td>${money(u.abono)}</td>
              <td><span class="badge pendiente">${money(computed(u).resta)}</span></td>
              <td><button class="btn small" onclick="openAbonoModal('${u.id}')">Abonar</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">Nadie debe nada en este momento.</div>`}
    </div>

    <div class="panel">
      <h2>Historial de abonos (${historial.length})</h2>
      <div style="margin-bottom:14px">
        <input type="text" id="buscarAbono" placeholder="Buscar por nombre de cliente..." value="${esc(abonosSearch)}">
      </div>
      ${historial.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Fecha</th><th>Cliente</th><th>Talla</th><th>Monto</th><th>Tipo</th><th>Nota</th><th></th></tr></thead>
        <tbody>
          ${historial.map(a => `
            <tr>
              <td>${fmtDate(a.fecha)}</td>
              <td>${esc(a.cliente) || '—'}</td>
              <td>${esc(a.talla) || '—'}</td>
              <td style="color:var(--teal)">${money(a.monto)}</td>
              <td><span class="badge ${a.tipo === 'abono' ? 'disponible' : 'vendido'}">${a.tipo === 'inicial' ? 'Inicial' : a.tipo === 'saldo-anterior' ? 'Saldo anterior' : 'Abono'}</span></td>
              <td>${esc(a.nota) || '—'}</td>
              <td><button class="btn small danger" onclick="deleteAbono('${a.id}')">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">${abonosSearch.trim() ? 'No hay abonos de ese cliente.' : 'Todavía no hay abonos en el historial.'}</div>`}
      <div class="muted" style="margin-top:10px">"Inicial" es lo que pagó al momento de la venta. "Saldo anterior" agrupa los abonos hechos antes de que existiera este historial.</div>
    </div>
  `;

  const form = document.getElementById('formNuevoAbono');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const u = units.find(x => x.id === f.unitId.value);
      if (!u) return;
      await guardarAbono(u, Number(f.monto.value) || 0, f.fecha.value, f.nota.value.trim());
    });
  }

  const searchInput = document.getElementById('buscarAbono');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      abonosSearch = e.target.value;
      const cursorPos = e.target.selectionStart;
      renderAbonos();
      const newInput = document.getElementById('buscarAbono');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(cursorPos, cursorPos);
      }
    });
  }
}

async function guardarAbono(u, monto, fecha, nota) {
  const resta = computed(u).resta;
  if (monto <= 0) { showToast('El monto debe ser mayor a 0.'); return false; }
  if (monto > resta) monto = resta;
  return guardar(() => Api.crearAbono(u.id, monto, fecha, nota),
    monto === resta ? 'Abono registrado · venta pagada completa' : 'Abono registrado');
}

function deleteAbono(id) {
  const a = abonos.find(x => x.id === id);
  if (!a) return;
  showConfirm(`¿Eliminar este abono de ${money(a.monto)}? Se restará del total abonado de esa venta.`, () =>
    guardar(() => Api.eliminarAbono(id), 'Abono eliminado'));
}

// ---------- RENDER: CLIENTES ----------
let clientesSearch = '';

function renderClientes() {
  const el = document.getElementById('tab-clientes');
  const vendidos = units.filter(u => u.estado === 'vendido' && u.cliente);
  const byClient = {};
  vendidos.forEach(u => {
    const key = u.cliente.trim();
    if (!byClient[key]) byClient[key] = { compras: 0, total: 0, pendiente: 0, items: [] };
    byClient[key].compras++;
    byClient[key].total += Number(u.venta) || 0;
    byClient[key].pendiente += computed(u).resta;
    byClient[key].items.push(u);
  });
  let names = Object.keys(byClient).sort();
  if (clientesSearch.trim()) {
    const q = clientesSearch.trim().toLowerCase();
    names = names.filter(n => n.toLowerCase().includes(q));
  }

  el.innerHTML = `
    <div class="panel">
      <h2>Clientes (${names.length})</h2>
      <div style="margin-bottom:14px">
        <input type="text" id="buscarClienteTab" placeholder="Buscar por nombre de cliente..." value="${esc(clientesSearch)}">
      </div>
      ${names.length ? names.map(name => `
        <div style="border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--bg-panel-2)">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px">
            <strong>${esc(name)}</strong>
            <span class="muted">${byClient[name].compras} compra(s) · ${money(byClient[name].total)}</span>
          </div>
          ${byClient[name].pendiente > 0 ? `<div style="margin-top:6px"><span class="badge pendiente">Debe ${money(byClient[name].pendiente)}</span></div>` : ''}
        </div>
      `).join('') : `<div class="empty">${clientesSearch.trim() ? 'No hay clientes con ese nombre.' : 'Todavía no hay clientes registrados.'}</div>`}
    </div>
  `;

  const searchInput = document.getElementById('buscarClienteTab');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      clientesSearch = e.target.value;
      const cursorPos = e.target.selectionStart;
      renderClientes();
      const newInput = document.getElementById('buscarClienteTab');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(cursorPos, cursorPos);
      }
    });
  }
}

// ---------- RENDER: GASTOS ----------
const CATEGORIAS_GASTO = ['Publicidad', 'Envíos', 'Empaques', 'Transporte', 'Arriendo', 'Servicios', 'Otro'];

function gastosDelMes(list, key) {
  return list.filter(g => monthKey(g.fecha) === key).reduce((s,g) => s + (Number(g.monto)||0), 0);
}

function renderGastos() {
  const el = document.getElementById('tab-gastos');
  const lista = [...gastos].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
  const totalGastos = gastos.reduce((s,g) => s + (Number(g.monto)||0), 0);
  const curMonthKey = todayISO().slice(0,7);
  const gastosMes = gastosDelMes(gastos, curMonthKey);

  const byCat = {};
  gastos.forEach(g => {
    const c = g.categoria || 'Otro';
    byCat[c] = (byCat[c] || 0) + (Number(g.monto)||0);
  });

  el.innerHTML = `
    <div class="grid-cards">
      <div class="stat neg"><div class="label">Gastos este mes</div><div class="value">${money(gastosMes)}</div></div>
      <div class="stat neg"><div class="label">Gastos totales</div><div class="value">${money(totalGastos)}</div></div>
    </div>

    <div class="panel">
      <h2>Registrar gasto</h2>
      <form id="formNuevoGasto" class="grid-form">
        <div>
          <label>Fecha</label>
          <input type="date" name="fecha" value="${todayISO()}" required>
        </div>
        <div>
          <label>Categoría</label>
          <select name="categoria">
            ${CATEGORIAS_GASTO.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Descripción</label>
          <input type="text" name="descripcion" placeholder="Ej: Publicidad Meta semana 1">
        </div>
        <div>
          <label>Monto</label>
          <input type="number" name="monto" min="0" placeholder="50000" required>
        </div>
        <div>
          <button class="btn" type="submit">Agregar gasto</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Gastos por categoría</h2>
      ${Object.keys(byCat).length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Categoría</th><th>Total</th></tr></thead>
        <tbody>
          ${Object.keys(byCat).sort((a,b) => byCat[b]-byCat[a]).map(c => `
            <tr><td>${esc(c)}</td><td>${money(byCat[c])}</td></tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">Aún no hay gastos registrados.</div>`}
    </div>

    <div class="panel">
      <h2>Historial de gastos (${lista.length})</h2>
      ${lista.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th></th></tr></thead>
        <tbody>
          ${lista.map(g => `
            <tr>
              <td>${fmtDate(g.fecha)}</td>
              <td>${esc(g.categoria) || '—'}</td>
              <td>${esc(g.descripcion) || '—'}</td>
              <td>${money(g.monto)}</td>
              <td><button class="btn small danger" onclick="deleteGasto('${g.id}')">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">No hay gastos registrados todavía.</div>`}
    </div>
  `;

  document.getElementById('formNuevoGasto').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const nuevo = {
      fecha: f.fecha.value,
      categoria: f.categoria.value,
      descripcion: f.descripcion.value.trim(),
      monto: Number(f.monto.value) || 0
    };
    await guardar(() => Api.crearGasto(nuevo), 'Gasto registrado');
  });
}

function deleteGasto(id) {
  showConfirm('¿Eliminar este gasto? Esta acción no se puede deshacer.', () =>
    guardar(() => Api.eliminarGasto(id), 'Gasto eliminado'));
}
function openVenderModal(unitId) {
  const u = units.find(x => x.id === unitId);
  if (!u) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h3>Registrar venta — ${esc(u.talla)}</h3>
        <form id="formVender">
          <div class="modal-row">
            <label>Cliente</label>
            <input type="text" name="cliente" required placeholder="Nombre del cliente">
          </div>
          <div class="modal-row">
            <label>Fecha de venta</label>
            <input type="date" name="fechaVenta" value="${todayISO()}" required>
          </div>
          <div class="modal-row">
            <label>Precio de venta</label>
            <input type="number" name="venta" min="0" required placeholder="135000" value="${u.precioVentaSugerido || ''}">
          </div>
          <div class="modal-row">
            <label>Abono inicial (deja en 0 si aún no ha pagado nada, o si fías)</label>
            <input type="number" name="abono" min="0" value="0">
            <button type="button" class="btn small secondary" style="margin-top:6px" onclick="document.querySelector('#formVender [name=abono]').value = document.querySelector('#formVender [name=venta]').value || 0">Pagó todo de contado</button>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
            <button type="submit" class="btn">Confirmar venta</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('formVender').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const venta = Number(f.venta.value) || 0;
    let abono = Number(f.abono.value) || 0;
    if (abono > venta) abono = venta;
    const datos = {
      cliente: f.cliente.value.trim(),
      fechaVenta: f.fechaVenta.value,
      venta, abono
    };
    // Lo que pague en el momento (de contado o una parte) queda en el
    // historial de abonos como "inicial" — lo registra el backend.
    if (await guardar(() => Api.vender(u.id, datos), 'Venta registrada')) closeModal();
  });
}

function openAbonoModal(unitId) {
  const u = units.find(x => x.id === unitId);
  if (!u) return;
  const resta = computed(u).resta;
  const previos = abonos.filter(a => a.unitId === u.id).sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h3>Registrar abono</h3>
        <p class="muted">Cliente: ${esc(u.cliente)} · ${esc(u.talla)} · Venta ${money(u.venta)} · Abonado ${money(u.abono)}<br><strong style="color:var(--red)">Saldo pendiente: ${money(resta)}</strong></p>
        <form id="formAbono">
          <div class="modal-row">
            <label>Fecha</label>
            <input type="date" name="fecha" value="${todayISO()}" required>
          </div>
          <div class="modal-row">
            <label>Monto del abono</label>
            <input type="number" name="monto" min="1" max="${resta}" required placeholder="50000">
            <button type="button" class="btn small secondary" style="margin-top:6px" onclick="document.querySelector('#formAbono [name=monto]').value = ${resta}">Pagó todo lo que debía</button>
          </div>
          <div class="modal-row">
            <label>Nota (opcional)</label>
            <input type="text" name="nota" placeholder="Nequi, efectivo...">
          </div>
          ${previos.length ? `
          <div class="modal-row">
            <label>Abonos anteriores</label>
            ${previos.map(a => `<div class="muted">${fmtDate(a.fecha)} · ${money(a.monto)}${a.nota ? ' · ' + esc(a.nota) : ''}</div>`).join('')}
          </div>` : ''}
          <div class="modal-actions">
            <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
            <button type="submit" class="btn">Registrar abono</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('formAbono').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const ok = await guardarAbono(u, Number(f.monto.value) || 0, f.fecha.value, f.nota.value.trim());
    if (ok) closeModal();
  });
}

function showConfirm(msg, onConfirm) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h3>Confirmar</h3>
        <p class="muted">${msg}</p>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button type="button" class="btn danger" id="confirmBtn" style="background:var(--red); color:#fff; border:none">Confirmar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirmBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

// ---------- TABS ----------
const TABS = ['resumen','inventario','ventas','abonos','clientes','gastos'];

function renderAll() {
  renderResumen();
  renderInventario();
  renderVentas();
  renderAbonos();
  renderClientes();
  renderGastos();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  TABS.forEach(t => {
    document.getElementById('tab-' + t).style.display = (t === tab) ? 'block' : 'none';
  });
}

document.querySelectorAll('nav.tabs button').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

// ---------- LOGIN ----------
function mostrarLogin() {
  closeModal();
  units = []; gastos = []; abonos = [];
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('loginUsuario').focus();
}
function mostrarApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  cargarDatos();
}

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    await Api.login(f.usuario.value.trim(), f.clave.value);
    f.clave.value = '';
    mostrarApp();
  } catch (err) {
    errEl.textContent = err.message;
  }
});
document.getElementById('btnSalir').addEventListener('click', () => { Api.salir(); mostrarLogin(); });
Api.alVencerSesion(mostrarLogin);

// ---------- INIT ----------
(function init() {
  const now = new Date();
  document.getElementById('todayLabel').textContent = now.toLocaleDateString('es-CO', { day:'numeric', month:'long', year:'numeric' });
  renderAll();
  if (Api.haySesion()) mostrarApp(); else mostrarLogin();
})();
</script>
</body>
</html>
